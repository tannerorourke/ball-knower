# --- Config--- ---------------------------------------------------------------
# from league URL: sleeper.com/leagues/<league_id>
league_id: ""

# your Sleeper username -> my_slot once the draft order is posted     
username: ""
my_slot: null  # override if username lookup fails

# optional; defaults to the league's current draft      
draft_id: ""

# --- API --------------------------------------------------------------------
data_dir: data
out_dir: out
poll_interval: 2.0
top_n: 12 # candidates shown / sent to the draft LLM for final suggestion
seed: 0                # 0 = random

# --- Monte Carlo survival ---------------------------------------------------
mc:
  sims: 2500
  pool: 20                  # top-N available by ADP simulated as pickable (auto-raised to cover the window)
  sigma_base: 1.0           # ADP std dev = sigma_base + sigma_slope * adp  (pick 50 -> ~7 picks)
  sigma_slope: 0.12
  run_shift: 0.4            # std devs: each same-position pick in the last run_window picks pulls that position up
  run_window: 4
  need_shift: {STARTER: 0, FLEX: 0.5, BACKUP: 1.0, DEPTH: 1.5, URGENT: 1.0, CAPPED: 20} # std devs added to a team's board
  autodraft_latency_s: 3.0  # min(median, mean) time-on-clock below this => classified autodraft
  autodraft_slots: []       # for n_minus calculation, assumes 0s time-on-clock
  pos_caps: {QB: 2, TE: 2, RB: 7, WR: 7, K: 1}

# --- Deterministic scoring --------------------------------------------------
scoring:
  ceiling_blend: {1: 0.0, 6: 0.15, 9: 0.30, 11: 0.50}  # round -> weight on (ceil - proj)
  need_weight: 6.0                                     # pts bonus for filling an open starting slot
  backup_weight: 0.8                                   # BACKUP bonus = backup_weight * need_weight
  backup_targets: {QB: 1, RB: 2, WR: 2, TE: 1, K: 0}   # direct backups to roster per position
  depth_while_starters_open: 15.0                      # pts against a DEPTH pick while starters are open
  depth_while_backups_open: 6.0                        # pts against a DEPTH pick while backup targets are open
  backup_bye_overlap_factor: 0.4                       # BACKUP bonus multiplier when bye collides with same-pos players
  wait_w: {STARTER: 1.0, FLEX: 0.8, BACKUP: 0.6, DEPTH: 0.15, CAPPED: 0.0, K-WAIT: 0.0}
  capped_multiplier: 3.0                               # CAPPED penalty = -capped_multiplier * need_weight
  urgency_factor: 2.0                                  # need multiplier when rounds run out
  stack_max_bonus: 6.0                                 # pts at stack_score 100
  risk_weight: 1.0                                     # pts per risk point (halved after round 6)
  replacement_extra: {QB: 3, RB: 2, WR: 2, TE: 2, K: 1} # replacement = last starter + this many (QB/TE: streamable)
  vorp_weight: 0.15                                    # adj = wait_w*wait_cost + vorp_weight*vorp + need + stack - anti - risk
  bench_penalty: {QB: 12.0, TE: 9.0, RB: 2.0, WR: 2.0, K: 15.0} # pts against a DEPTH pick, x depth
  bench_free_round: 9                                  # depth penalties halve from this round
  pos_caps: {QB: 3, TE: 2, RB: 7, WR: 7, K: 1}

# --- LLM card ---------------------------------------------------------------
llm:
  backend: claude-cli  # shared by research + draft: claude-cli | anthropic | openai-compat | none
                       # claude-cli = Claude subscription, anthropic = api billing
  research_model: "claude-opus-5"   # pre-draft judgment pass
  draft_model: "claude-sonnet-5"    # live cards (speed matters)
  base_url: "" # openai-compat only,
               # e.g. https://openrouter.ai/api/v1, https://api.openai.com/v1, http://localhost:11434/v1 (ollama)
  api_key_env: SLEEPER_LLM_KEY  # env var holding the key; unset = no auth header (local models)
  research_timeout_s: 900
  draft_timeout_s: 90
  at_n_minus: true    # if true, generate a card ahead of my pick (costs one extra call per turn)
  n_minus: 2          # spots ahead of my pick to pre-generate the card (count rule)
  eta_trigger_s: 60   # also fire early when expected wait to my pick <= this (time rule, from round 4)
  post_pick: true     # after my pick, run a team-state analysis call (skipped before back-to-back picks)

strategy_notes: >
  Balanced build. Rounds 1-5 prefer floor and LOCKED roles. Do not take a second TE before round 12
  or a second QB before round 11. A stack with my QB breaks ties inside a tier only. Rounds 11-14:
  ceiling, handcuffs of my RBs, one IR_STASH if available.

# --- Mock draft -------------------------------------------------------------
mock:
  teams: 12
  rounds: 14
  my_slot: 10
  pick_timer: 180
  roster_positions: [QB, RB, RB, WR, WR, TE, FLEX, FLEX, BN, BN, BN, BN, BN, BN, IR]
  autodraft_teams: 3
  autodraft_slots: []   # explicit autodraft slots; overrides autodraft_teams when non-empty
  human_min_s: 8
  human_max_s: 45
  my_pick_delay_s: 20
  speed: 10             # wall-clock divisor
  fault_at_pick: 0      # pick count at which the mock client starts raising ConnectionError (0 = never)
  fault_n_polls: 0      # how many consecutive polls fail once triggered

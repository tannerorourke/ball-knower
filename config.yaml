# --- Sleeper ---------------------------------------------------------------
league_id: ""  # sleeper.com/leagues/<league_id>
username: ""
draft_id: ""
my_slot: null  # override if username lookup fails

# --- API --------------------------------------------------------------------
data_dir: data
out_dir: out
poll_interval: 2.0
top_n: 12
seed: 0  # 0 = random

# --- Monte Carlo survival ---------------------------------------------------
mc:
  sims: 2500
  pool: 80
  sigma_base: 1.0
  sigma_slope: 0.12
  run_shift: 0.4
  run_window: 4
  need_shift: {STARTER: 0, FLEX: 0.5, BACKUP: 1.0, DEPTH: 1.5, URGENT: 1.0, CAPPED: 20} # std devs added to a team's board
  autodraft_latency_s: 3.0
  autodraft_slots: []
  pos_caps: {QB: 2, TE: 2, RB: 7, WR: 7, K: 1}
  slot_tendencies: true
  tendency_prior_picks: 4
  lean_shift: 1.0

# --- Deterministic scoring --------------------------------------------------
scoring:
  ceiling_blend: {1: 0.0, 6: 0.15, 9: 0.30, 11: 0.50}
  need_weight: 6.0
  backup_weight: 0.8
  backup_targets: {QB: 1, RB: 2, WR: 2, TE: 1, K: 0}
  depth_while_starters_open: 15.0
  depth_while_backups_open: 6.0
  backup_bye_overlap_factor: 0.4
  wait_w: {STARTER: 1.0, FLEX: 0.8, BACKUP: 0.6, DEPTH: 0.15, CAPPED: 0.0, K-WAIT: 0.0}
  capped_multiplier: 3.0
  urgency_factor: 2.0
  stack_max_bonus: 6.0
  risk_weight: 1.0
  replacement_extra: {QB: 3, RB: 2, WR: 2, TE: 2, K: 1}
  vorp_weight: 0.15
  bench_penalty: {QB: 12.0, TE: 9.0, RB: 2.0, WR: 2.0, K: 15.0}
  bench_free_round: 9
  pos_caps: {QB: 3, TE: 2, RB: 7, WR: 7, K: 1}

# --- LLM --------------------------------------------------------------------
llm:
  backend: claude-cli  # claude-cli | anthropic | openai-compat | none
  research_model: "claude-fable-5"
  draft_model: "claude-sonnet-4-6"
  base_url: ""
  api_key_env: SLEEPER_API_KEY
  research_timeout_s: 900
  draft_timeout_s: 90
  at_n_minus: true
  n_minus: 2
  eta_trigger_s: 60
  post_pick: true

strategy_notes: >
  Balanced build. Rounds 1-5 prefer floor and LOCKED roles. Do not take a second TE before round 12
  or a second QB before round 11. A stack with my QB breaks ties inside a tier only. Rounds 11-14:
  ceiling, handcuffs of my RBs, one IR_STASH if available.

# --- Mock draft (python -m sleeper_agent mock) ------------------------------
mock:
  teams: 12
  rounds: 14
  my_slot: 10
  pick_timer: 180
  roster_positions: [QB, RB, RB, WR, WR, TE, FLEX, FLEX, BN, BN, BN, BN, BN, BN, IR]
  autodraft_teams: 3
  autodraft_slots: []
  human_min_s: 8
  human_max_s: 45
  my_pick_delay_s: 20
  speed: 10
  fault_at_pick: 0
  fault_n_polls: 0
